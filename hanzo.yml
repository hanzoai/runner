# Hanzo CI/CD for hanzoai/runner: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: runner
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/runner
    platforms: [linux/amd64]
